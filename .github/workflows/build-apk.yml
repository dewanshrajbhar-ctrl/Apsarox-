name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER_STRING=$(java -version 2>&1 | head -n 1)
          echo "Detected version string: $JAVA_VER_STRING"

          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{if ($1 == "1") {print $2} else {print $1}}')
          echo "Detected Java major version: $JAVA_MAJOR"

          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Unable to detect active Java major version."
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Active Java major version is $JAVA_MAJOR, which is lower than required version 17."
            exit 1
          fi
          echo "Java 17+ environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Debug keystore already exists at $KEYSTORE_PATH. Skipping generation."
          else
            echo "Debug keystore not found at $KEYSTORE_PATH. Generating temporary keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ ! -f "$KEYSTORE_PATH" ]; then
              echo "::error::Failed to generate temporary debug keystore at $KEYSTORE_PATH."
              exit 1
            fi
            echo "Temporary debug keystore created successfully at $KEYSTORE_PATH."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        id: verify_apk
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK."
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk" -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Found APK file at $EXPECTED_APK, but it is empty (0 bytes)."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "::error::$EXPECTED_APK does not end in .apk"; exit 1 ;;
          esac

          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK")
          echo "Verified APK exists at $EXPECTED_APK (Size: $APK_SIZE bytes)."
          echo "apk_path=$EXPECTED_APK" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_ASSET_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "$TEMP_ASSET_DIR"

          RAW_REPO_NAME="${{ github.repository }}"
          REPO_NAME_ONLY="${RAW_REPO_NAME##*/}"
          SANITIZED_NAME=$(echo "$REPO_NAME_ONLY" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9_-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$SANITIZED_NAME" ]; then
            SANITIZED_NAME="app"
          fi

          RELEASE_APK_NAME="${SANITIZED_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_APK_PATH="${TEMP_ASSET_DIR}/${RELEASE_APK_NAME}"

          cp -v "app/build/outputs/apk/debug/app-debug.apk" "$DEST_APK_PATH"

          if [ ! -f "$DEST_APK_PATH" ] || [ ! -s "$DEST_APK_PATH" ]; then
            echo "::error::Failed to stage release asset at $DEST_APK_PATH."
            exit 1
          fi

          echo "Staged release asset at: $DEST_APK_PATH"
          echo "asset_path=$DEST_APK_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI version..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ]; then
            echo "::error::Release asset not found at $ASSET_PATH"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          cat << 'EOF' > "${RUNNER_TEMP}/release_notes.md"
          ## Automated Debug Build

          This is an automated debug APK build for testing purposes.

          > **Note:**
          > - This APK is signed with the standard Android debug keystore.
          > - It is **not** intended for Google Play Store release.
          > - You can install this APK directly onto Android test devices.

          ### Build Details
          - **Workflow Run:** #${{ github.run_number }} (Attempt #${{ github.run_attempt }})
          - **Commit SHA:** `${{ github.sha }}`
          - **Triggered By:** `${{ github.event_name }}` on branch `${{ github.ref_name }}`
          - **Asset Name:** `${ASSET_NAME}`
          EOF

          # Replace variable placeholder in release notes
          sed -i "s/\${ASSET_NAME}/$ASSET_NAME/g" "${RUNNER_TEMP}/release_notes.md"

          echo "Publishing release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "${RUNNER_TEMP}/release_notes.md" \
            --target "${{ github.sha }}" \
            --latest

          echo "Release published successfully."
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ steps.publish_release.outputs.tag_name }}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          echo "### 📱 Android Debug APK Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build Run:** #${{ github.run_number }} (Attempt #${{ github.run_attempt }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "Release created successfully for tag: $TAG_NAME"
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q '.url' 2>/dev/null || echo "")
            DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${ASSET_NAME}"

            echo "Release URL: $RELEASE_URL"
            echo "Asset Download: $DOWNLOAD_URL"

            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### ✅ GitHub Release Available" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Tag:** \`$TAG_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$RELEASE_URL" ]; then
              echo "- **Release Page:** [View Release]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "- **Direct Download:** [\`$ASSET_NAME\`]($DOWNLOAD_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact:** Preserved as [\`app-debug-apk\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation step was not completed or failed. Falling back to workflow artifact."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### ⚠️ GitHub Release Fallback" >> "$GITHUB_STEP_SUMMARY"
            echo "The GitHub Release step could not be completed, but the debug APK was built and preserved as an Actions artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Artifact Name:** \`app-debug-apk\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Download Location:** [Actions Run Artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> "$GITHUB_STEP_SUMMARY"
          fi
