<div id="side" class="np"></div><main id="app"></main><dialog id="dlg"></dialog>
<script>
const K='apsarox_v2',$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),dsf=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;

const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const ST={Present:['✅','g'],Absent:['❌','r'],'Half Day':['◐','o'],Leave:['🌴','bl'],Holiday:['🎉','bl'],Sunday:['🛌','m'],'Weekly Off':['🛌','m'],WFH:['🏠','g'],'Missing IN':['⚠️','o'],'Missing OUT':['⚠️','o'],Pending:['⏳','m'],'No Record':['❔','m']};

function seed(){const d={emp:[],att:{},hol:[],cfg:defCfg()};

 d.hol=[{id:'h1',d:'2026-09-04',n:'Janmashtami',t:'Festival',desc:''},{id:'h2',d:'2026-09-14',n:'Ganesh Chaturthi',t:'Festival',desc:''},{id:'h3',d:'2026-10-02',n:'Gandhi Jayanti',t:'National',desc:''}];
 d.emp.forEach((e,i)=>{for(let day=1;day<=30;day++){const k=dsf(2026,9,day);if(new Date(k+'T00:00').getDay()==0||day==4||day==14)continue;

 A(1,8,{i:'',o:'',s:'Leave'});delete d.att['e1|2026-09-15'];A(1,22,{o:'19:15'});A(2,12,{s:'WFH',n:'Work from home'});A(2,19,{s:'Half Day',o:'13:30',b:0});A(2,5,{p:['09:00','13:00','14:00','18:30'],i:'09:00',o:'18:30',n:'Lunch out/in (multiple punches)'});
 Object.values(d.att).forEach(r=>{if(r.i&&r.i.length<5)r.i='0'+r.i});d.loans=[{id:'l1',emp:'e1',amt:12000,emi:2000,start:'2026-08',note:'Personal loan'}];d.adv=[{id:'a1',emp:'e0',d:'2026-09-10',amt:3000,note:'Festival advance'}];return d}

let S={user:null,view:'dash',y:2026,m:9,eid:'',tab:'table',q:'',dept:'',stat:'',rep:'monthly',from:'2026-09-01',to:'2026-09-30',err:''};
S.y=N.getFullYear();S.m=N.getMonth()+1;S.from=dsf(S.y,S.m,1);S.to=dsf(S.y,S.m,dim(S.y,S.m));
const E=id=>db.emp.find(e=>e.id==id),isA=()=>S.user&&S.user.role=='admin';
function info(e,d){const r=db.att[e.id+'|'+d]||{},c=db.cfg,dw=new Date(d+'T00:00').getDay(),h=db.hol.find(x=>x.d==d),off=(e.off||[0]).includes(dw),hp=r.p&&r.p.length,p=hp?r.p:[r.i,r.o].filter(Boolean),i=hp?tm(p[0]):tm(r.i),o=hp?(p.length%2==0?tm(p[p.length-1]):null):tm(r.o);let w=0;
 if(p.length>2&&hp){for(let k=0;k+1<p.length;k+=2){let x=tm(p[k+1])-tm(p[k]);if(x<0&&c.night)x+=1440;w+=Math.max(0,x)}}
 else if(i!=null&&o!=null){let x=o-i;if(x<0&&c.night)x+=1440;w=Math.max(0,x-(+r.b||0))}
 let s=r.s;if(!s)s=i!=null&&o!=null?'Present':i!=null?'Missing OUT':o!=null?'Missing IN':off?(dw==0?'Sunday':'Weekly Off'):h?'Holiday':d<today?(c.absent?'Absent':'No Record'):'Pending';
 const req=e.hrs*60,wk=s=='Present'||s=='WFH';
 return{p,cnt:hp?Math.ceil(p.length/2):(r.i?1:0),ins:hp?p.filter((_,k)=>k%2==0):(r.i?[r.i]:[]),outs:hp?p.filter((_,k)=>k%2==1):(r.o?[r.o]:[]),s,w,ot:wk&&w>req?w-req:0,sh:wk&&w<req?req-w:0,late:i!=null&&i>tm(c.start)+ +c.grace?i-tm(c.start):0,early:o!=null&&i!=null&&o<tm(c.end)&&o>=i?tm(c.end)-o:0,r,h,dw,off}}
function ms(e,y,m){const n=dim(y,m),z={n,work:0,P:0,A:0,H:0,L:0,off:0,hol:0,wfh:0,w:0,ot:0,sh:0,late:0,lateMin:0,early:0,earlyMin:0,miss:0};
 for(let d=1;d<=n;d++){const x=info(e,dsf(y,m,d));z.w+=x.w;z.ot+=x.ot;z.sh+=x.sh;if(x.late){z.late++;z.lateMin+=x.late}if(x.early){z.early++;z.earlyMin+=x.early}
  const s=x.s;if(s=='Sunday'||s=='Weekly Off')z.off++;else if(s=='Holiday')z.hol++;else z.work++;
  if(s=='Present')z.P++;else if(s=='WFH')z.wfh++;else if(s=='Absent')z.A++;else if(s=='Half Day')z.H++;else if(s=='Leave')z.L++;else if(s.startsWith('Missing'))z.miss++}
 z.pct=z.work?(z.P+z.wfh+z.H*.5)/z.work*100:0;return z}
function emiOf(id,y,m){let t=0;db.loans.filter(l=>l.emp==id).forEach(l=>{const k=(y-+l.start.slice(0,4))*12+m-+l.start.slice(5);if(k>=0&&k<Math.ceil(l.amt/l.emi))t+=Math.min(l.emi,l.amt-k*l.emi)});return t}
function sal(e,y,m){const z=ms(e,y,m),c=db.cfg,den=c.method=='working'?z.work:c.method=='calendar'?z.n:30,day=den?e.salary/den:0;
 const paidL=c.paidLeave?z.L:0,pay=z.P+z.wfh+z.H*.5+paidL+(c.method=='working'?0:z.off+z.hol),rate=+c.otRate||(e.hrs?day/e.hrs:0),ot=z.ot/60*rate,ded=z.late*(+c.lateFine||0);
 const earned=Math.min(day*pay,e.salary+ (c.method=='working'?0:0));const emi=emiOf(e.id,y,m),adv=db.adv.filter(a=>a.emp==e.id&&a.d.slice(0,7)==y+'-'+pad(m)).reduce((t,a)=>t+a.amt,0);return{z,day,pay,paidL,unpaidL:c.paidLeave?0:z.L,rate,ot,ded,earned,emi,adv,net:earned+ot-ded-emi-adv}}
const dl=async(n,t,ty)=>{
 if(window.AndroidBridge&&window.AndroidBridge.onFileExport){window.AndroidBridge.onFileExport(n,t,ty);return}
 try{const blob=new Blob([t],{type:ty});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('Export completed')}};
const csv=(h,r)=>[h,...r].map(a=>a.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');

const v=id=>$('#'+id).value,fld=(id,l,val='',t='text',x='')=>`<div class="f"><label class="sm">${l}</label><input id="${id}" type="${t}" value="${esc(val)}" ${x}></div>`;
const sel=(id,l,opts,cur)=>`<div class="f"><label class="sm">${l}</label><select id="${id}">${opts.map(o=>`<option ${o==cur?'selected':''}>${o}</option>`).join('')}</select></div>`;
function login(){return`<div class="login card"><h1>🧾 ApsaRox</h1><div class="f"><label class="sm">Username (admin or Employee ID)</label><input id="lu"></div><div class="f"><label class="sm">Password</label><input id="lp" type="password" onkeydown="if(event.key=='Enter')doLogin()"></div><p style="color:var(--r)">${S.err}</p><button onclick="doLogin()" style="width:100%">Login</button><p class="sm">Demo: admin / admin · employee: E001 / E001</p></div>`}
function doLogin(){const u=v('lu').trim().toLowerCase(),p=v('lp');if(u=='admin'&&p==db.cfg.pass){S.user={role:'admin'};S.err='';S.view='dash'}
 else{const e=db.emp.find(x=>x.eid.toLowerCase()==u&&x.active);if(e&&p.toLowerCase()==u){S.user={role:'emp',id:e.id};S.eid=e.id;S.view='att';S.err=''}else S.err='Invalid login'}R()}
const NAV=[['dash','📊','Dashboard',1],['att','🕘','Attendance',0],['emp','👤','Employees',1],['hol','🎉','Holidays',1],['fin','💳','Loan/Advance',1],['pay','💰','Payroll',1],['rep','🧾','Reports',1],['set','⚙️','Settings',1]];
const empOpts=()=>db.emp.map(e=>`<option value="${e.id}" ${e.id==S.eid?'selected':''}>${esc(e.eid+' · '+e.name)}</option>`).join('');
const ymPick=()=>`<select onchange="S.m=+this.value;R()">${MN.map((n,i)=>`<option value="${i+1}" ${S.m==i+1?'selected':''}>${n}</option>`).join('')}</select><input type="number" style="width:84px" value="${S.y}" min="2000" max="2100" onchange="S.y=+this.value||S.y;R()">`;
function bars(t,a,f=x=>x){const mx=Math.max(1,...a);return`<div class="card"><h2>${t}</h2><div class="bars">${a.map((x,i)=>`<i title="${i+1}: ${f(x)}" style="height:${x/mx*100}%"></i>`).join('')}</div><div class="sm">Day 1 → ${a.length}</div></div>`}
function Vdash(){const act=db.emp.filter(e=>e.active),T=act.map(e=>info(e,today)),c=s=>T.filter(x=>s.includes(x.s)).length,n=dim(S.y,S.m);
 const per=[],wh=[],ot=[];for(let d=1;d<=n;d++){let p=0,w=0,o=0;act.forEach(e=>{const x=info(e,dsf(S.y,S.m,d));if(['Present','WFH','Half Day'].includes(x.s))p++;w+=x.w;o+=x.ot});per.push(p);wh.push(w/60);ot.push(o/60)}
 const card=(l,x)=>`<div class="card"><div class="sm">${l}</div><div class="big">${x}</div></div>`;
 return`<h1>Dashboard <span class="sm">${today}</span></h1><div class="grid">${card('Total Employees',act.length)}${card('Present Today',c(['Present','WFH','Half Day','Missing OUT']))}${card('Absent Today',c(['Absent']))}${card('On Leave',c(['Leave']))}${card('Weekly Off',c(['Sunday','Weekly Off']))}${card('Holidays',c(['Holiday']))}${card('Late Employees',T.filter(x=>x.late).length)}${card('Overtime Today',hm(T.reduce((s,x)=>s+x.ot,0)))}</div>
 <div class="row" style="margin-top:12px">${ymPick()}</div>${bars('Employees present per day',per)}${bars('Working hours per day',wh,x=>x.toFixed(1)+'h')}${bars('Overtime hours per day',ot,x=>x.toFixed(1)+'h')}`}
function Vatt(){const e=E(S.eid)||(isA()?db.emp[0]:null);if(!e)return'<p>No employee.</p>';S.eid=e.id;const n=dim(S.y,S.m),t=info(e,today),z=ms(e,S.y,S.m),rows=[];
 for(let d=1;d<=n;d++)rows.push([d,dsf(S.y,S.m,d),info(e,dsf(S.y,S.m,d))]);
 const act=(a,l,c='')=>`<button class="${c}" onclick="${a}">${l}</button>`;
 let o=`<h1>Attendance</h1><div class="card"><div class="row sp"><div><b>${esc(e.name)}</b> <span class="sm">${e.eid} · ${today} ${DN[N.getDay()]}</span></div>${tag(t.s)}</div>
 <div class="sm" style="margin:6px 0">Punches: ${t.p.map((x,k)=>(k%2?'OUT ':'IN ')+x).join(' · ')||'—'} · IN count ${t.cnt} · Work ${hm(t.w)} · OT ${hm(t.ot)}${t.late?' · Late '+t.late+'m':''}</div>
 <div class="row">${act(`punch('${e.id}','i')`,'▶ Check IN','ci')}${act(`punch('${e.id}','o')`,'⏹ Check OUT','co')}</div>
 ${isA()?`<div class="row" style="margin-top:8px">${act(`editA('${e.id}','${today}')`,'Edit','s')}${act(`mark('${e.id}','${today}','Leave')`,'Mark Leave','s')}${act(`mark('${e.id}','${today}','Holiday')`,'Mark Holiday','s')}${act(`mark('${e.id}','${today}','Absent')`,'Mark Absent','s')}${act(`clr('${e.id}','${today}')`,'Clear','s')}</div>`:''}</div>
 <div class="row">${isA()?`<select onchange="S.eid=this.value;R()">${empOpts()}</select>`:''}${ymPick()}<button class="s" onclick="S.tab='${S.tab=='table'?'cal':'table'}';R()">${S.tab=='table'?'📅 Calendar view':'📋 Table view'}</button><button class="s" onclick="expAtt()">⬇ CSV</button></div>
 <div class="grid" style="margin:8px 0">${[['Calendar days',z.n],['Working days',z.work],['Present',z.P+z.wfh],['Absent',z.A],['Half days',z.H],['Leave',z.L],['Weekly off',z.off],['Holidays',z.hol],['Work hours',hm(z.w)],['Overtime',hm(z.ot)],['Short hours',hm(z.sh)],['Late days',z.late],['Early leave',z.early],['Attendance',z.pct.toFixed(1)+'%']].map(x=>`<div class="card"><div class="sm">${x[0]}</div><b>${x[1]}</b></div>`).join('')}</div>`;
 if(S.tab=='cal'){const f=new Date(S.y,S.m-1,1).getDay();o+=`<div class="cal">${DN.map(x=>`<b class="sm" style="background:none;border:0;min-height:0">${x}</b>`).join('')}${'<span></span>'.repeat(f)}${rows.map(([d,k,x])=>`<div onclick="${isA()?`editA('${e.id}','${k}')`:''}"><b>${d}</b> ${ST[x.s][0]}<br>${x.s}${x.w?'<br>'+hm(x.w):''}</div>`).join('')}</div>`}
 else o+=`<div class="card sc"><table><tr><th>Date</th><th>Day</th><th>IN</th><th>OUT</th><th>Break</th><th>Work</th><th>OT</th><th>Status</th><th>Holiday</th><th>Notes</th><th></th></tr>${rows.map(([d,k,x])=>`<tr><td>${pad(d)}/${pad(S.m)}/${S.y}</td><td>${DN[x.dw]}</td><td>${x.ins.join(', ')||'—'}${x.cnt>1?` <span class="sm">(${x.cnt}×)</span>`:''}</td><td>${x.outs.join(', ')||'—'}</td><td>${x.r.b||0}m</td><td>${hm(x.w)}</td><td>${hm(x.ot)}</td><td>${tag(x.s)}${x.late?` <span class="sm">late ${x.late}m</span>`:''}${x.early?` <span class="sm">early ${x.early}m</span>`:''}</td><td>${x.h?esc(x.h.n):x.off?'Weekly Off':'—'}</td><td>${esc(x.r.n||'')}</td><td>${isA()?`<button class="s" onclick="editA('${e.id}','${k}')">Edit</button>`:''}</td></tr>`).join('')}</table></div>`;
 return o}
function rec(id,d){return db.att[id+'|'+d]||(db.att[id+'|'+d]={i:'',o:'',b:60,s:'',n:''})}
function punch(id,k){const r=rec(id,today);if(!r.p)r.p=[r.i,r.o].filter(Boolean);const odd=r.p.length%2;if(k=='i'&&odd)return alert('Already checked IN. Check OUT first.');if(k=='o'&&!odd)return alert('Not checked IN. Check IN first.');r.p.push(nowT());r.i=r.p[0];r.o=r.p.length%2==0?r.p[r.p.length-1]:'';save();R()}
